name: czech-vat-mcp
displayName: Czech VAT Compliance
description: |
  Czech VAT compliance tools for AI assistants. Checks unreliable VAT payers (nespolehlivý plátce DPH),
  registered bank accounts, company lookup via ARES, and EU VAT validation via VIES.
  Essential for Czech/Slovak businesses to avoid VAT liability under §109 ZDPH.

  Free tier: 10 calls/day. Unlimited access: $9/month → https://buy.stripe.com/4gM3cw8Dz28qcAYdHJaEE00
version: 1.0.0
license: MIT
categories:
  - finance
  - compliance
  - czech
  - business
tags:
  - czech
  - vat
  - dph
  - ares
  - vies
  - compliance
  - finance
  - nespolehlivy-platce
startCommand:
  type: http
  url: https://worthy-adventure-production.up.railway.app/mcp
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: API Key — Unlimited Access ($9/month)
        description: "Free tier: 10 calls/day. Remove limit with a paid key → https://buy.stripe.com/4gM3cw8Dz28qcAYdHJaEE00"
    required: []
  exampleConfig:
    apiKey: "km_your_key_here"
